plugins {
    id 'java'
    id 'application'
}
group = 'org.elci'
repositories { mavenLocal(); mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    implementation "org.julclang:julc-compiler:${julcVersion}"
    implementation "org.julclang:julc-stdlib:${julcVersion}"
    implementation "org.julclang:julc-vm-java:${julcVersion}"
    implementation "org.julclang:julc-cardano-client-lib:${julcVersion}"
    implementation 'com.bloxbean.cardano:cardano-client-lib:0.7.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'org.elci.cli.Main'; applicationName = 'elci' }
def buildMetadataDir = layout.buildDirectory.dir('generated/build-metadata')
tasks.register('generateBuildMetadata') {
    inputs.property('version', project.version.toString())
    inputs.property('julcVersion', julcVersion)
    outputs.dir(buildMetadataDir)
    doLast {
        def output = buildMetadataDir.get().file('elci-build.properties').asFile
        output.parentFile.mkdirs()
        output.text = "version=${project.version}\njulcVersion=${julcVersion}\n"
    }
}
sourceSets.main.resources.srcDir(buildMetadataDir)
processResources.dependsOn generateBuildMetadata
test { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }
tasks.register('nativeCompile', Exec) {
    dependsOn installDist
    def graalHome = providers.environmentVariable('GRAALVM_HOME')
    doFirst {
        if (!graalHome.isPresent()) {
            throw new GradleException('GRAALVM_HOME must point to a GraalVM installation containing native-image')
        }
        file('build/native').mkdirs()
        // Executable mode is the native-image default (equivalent to sharedLibrary = false).
        commandLine "${graalHome.get()}/bin/native-image", '--no-fallback', '-H:+ReportExceptionStackTraces',
            '-cp', fileTree('build/install/elci/lib').files.collect { it.absolutePath }.join(File.pathSeparator),
            application.mainClass.get(), file('build/native/elci').absolutePath
    }
}

tasks.register('writeRuntimeClasspath') {
    doLast { file('build/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
