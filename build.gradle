plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}
group = 'org.elci'
repositories {
    mavenLocal()
    mavenCentral()
    // BloxBean Maven repository: development snapshots of BloxBean projects, including the pinned Julc
    // (release-ops docs/12-bloxbean-maven-repository.md). snapshotsOnly() keeps releases on Maven Central.
    maven {
        url = uri('https://repo.bloxbean.org/maven/snapshots')
        mavenContent { snapshotsOnly() }
    }
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    // The BloxBean Maven repository publishes jar, sources and javadoc (release-ops verify-maven-staging.py).
    withSourcesJar()
    withJavadocJar()
}
dependencies {
    implementation "org.julclang:julc-compiler:${julcVersion}"
    implementation "org.julclang:julc-stdlib:${julcVersion}"
    implementation "org.julclang:julc-vm-java:${julcVersion}"
    implementation "org.julclang:julc-cardano-client-lib:${julcVersion}"
    implementation "org.julclang:julc-testkit:${julcVersion}"
    implementation 'com.bloxbean.cardano:cardano-client-lib:0.7.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // JVM property tests over Elci validators (ADR-006): jqwik with Julc's schema-driven arbitraries.
    testImplementation "org.julclang:julc-testkit-jqwik:${julcVersion}"
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'org.elci.cli.Main'; applicationName = 'elci' }
def buildMetadataDir = layout.buildDirectory.dir('generated/build-metadata')
tasks.register('generateBuildMetadata') {
    inputs.property('version', project.version.toString())
    inputs.property('julcVersion', julcVersion)
    outputs.dir(buildMetadataDir)
    doLast {
        def output = buildMetadataDir.get().file('elci-build.properties').asFile
        output.parentFile.mkdirs()
        output.text = "version=${project.version}\njulcVersion=${julcVersion}\n"
    }
}
sourceSets.main.resources.srcDir(buildMetadataDir)
processResources.dependsOn generateBuildMetadata
sourcesJar.dependsOn generateBuildMetadata
// Most of the compiler has no javadoc; the javadoc jar exists for the Maven repository's complete-set check.
javadoc { options.addBooleanOption('Xdoclint:none', true) }
test { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }
tasks.register('nativeCompile', Exec) {
    dependsOn installDist
    def graalHome = providers.environmentVariable('GRAALVM_HOME')
    doFirst {
        if (!graalHome.isPresent()) {
            throw new GradleException('GRAALVM_HOME must point to a GraalVM installation containing native-image')
        }
        file('build/native').mkdirs()
        // The arguments go in an argument file: on Windows native-image is a .cmd script, and cmd.exe limits a
        // command line to 8191 characters, less than the class path. Forward slashes need no quoting in the file.
        def path = { File f -> f.absolutePath.replace('\\', '/') }
        def arguments = file('build/native/native-image.args')
        // Executable mode is the native-image default (equivalent to sharedLibrary = false). On Windows the image
        // is build/native/elci.exe.
        arguments.text = ['--no-fallback', '-H:+ReportExceptionStackTraces',
            '-cp', fileTree('build/install/elci/lib').files.collect(path).join(File.pathSeparator),
            application.mainClass.get(), path(file('build/native/elci'))].join('\n') + '\n'
        def windows = System.getProperty('os.name').toLowerCase().contains('windows')
        commandLine new File(graalHome.get(), windows ? 'bin/native-image.cmd' : 'bin/native-image').absolutePath,
            "@${path(arguments)}"
    }
}

tasks.register('writeRuntimeClasspath') {
    doLast { file('build/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}

// The compiler as a library, for Java tests that run Elci validators (docs/TESTING.md). Snapshots go to the
// BloxBean Maven repository through .github/workflows/bloxbean-snapshot.yml, which sets the version.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'Elci'
                description = 'An Elm-syntax functional language for Cardano, powered by Julc'
                url = 'https://github.com/bloxbean/elci-lang'
                scm {
                    url = 'https://github.com/bloxbean/elci-lang'
                    connection = 'scm:git:https://github.com/bloxbean/elci-lang.git'
                }
            }
        }
    }
}

// The `stagingRepository` hook (release-ops docs/12-bloxbean-maven-repository.md): publishes the publications
// to a local directory, which CI uploads. CI passes an absolute path:
// `./gradlew publishAllPublicationsToStagingRepository -PstagingRepository=$PWD/...`.
def stagingRepository = providers.gradleProperty('stagingRepository')
if (stagingRepository.isPresent()) {
    publishing.repositories {
        maven {
            name = 'staging'
            url = uri(stagingRepository.get())
        }
    }
}
