name: Build distributions

# Builds the distribution files of the checked-out commit as dist-* workflow artifacts and smoke-tests each one:
#   elci-<version>.zip                       the JVM distribution (`distZip`), for any OS with Java 25
#   elci-<version>-<platform>.tar.gz         the native CLI for linux-x64, linux-arm64 and macos-arm64
#   elci-<version>-windows-x64.zip           the native CLI for Windows
# The version is <gradle.properties version>-<short commit id>-SNAPSHOT, as bloxbean-snapshot.yml gives the Maven
# snapshot. The native packages have release.yml's layout and GraalVM pin; release.yml does not build Windows yet.
#
# bloxbean-snapshot-dist.yml calls this workflow and publishes exactly these files. A pull request that changes
# this workflow, the smoke test or the native-image metadata runs it as a check; nothing is published from it.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - .github/workflows/dist-build.yml
      - .github/scripts/cli-smoke.sh
      - src/main/resources/META-INF/native-image/**

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      julc-version: ${{ steps.version.outputs.julc-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^version=//p' gradle.properties)
          VERSION="${BASE%-SNAPSHOT}-${GITHUB_SHA::7}-SNAPSHOT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)*-[0-9a-f]{7}-SNAPSHOT$ ]]; then
            echo "::error::Unexpected snapshot version: $VERSION" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "julc-version=$(sed -n 's/^julcVersion=//p' gradle.properties)"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

  jvm:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JULC_VERSION: ${{ needs.version.outputs.julc-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # The push CI (build.yml) runs the tests; the caller requires it to be green for this commit.
      - name: Build the JVM distribution
        run: ./gradlew --no-daemon distZip -Pversion="$VERSION" --stacktrace
      - name: Smoke test the JVM distribution
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "build/distributions/elci-$VERSION.zip" -d build/jvm-smoke
          bash .github/scripts/cli-smoke.sh "build/jvm-smoke/elci-$VERSION/bin/elci"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-jvm
          path: build/distributions/elci-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 7

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JULC_VERSION: ${{ needs.version.outputs.julc-version }}
      PACKAGE: elci-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@f60d4ea89f14098520aea588431217bbd9551570 # v1.6.5
        with:
          distribution: graalvm
          version: '25.3.4.1'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # native-image on Windows needs the MSVC toolchain on PATH.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Verify GraalVM version
        shell: bash
        run: |
          grep -F 'GRAALVM_VERSION="25.3.4.1"' "$JAVA_HOME/release"
          echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Build the native CLI
        shell: bash
        run: ./gradlew --no-daemon nativeCompile -Pversion="$VERSION" --stacktrace
      - name: Smoke test the native CLI
        shell: bash
        run: bash .github/scripts/cli-smoke.sh build/native/elci
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "build/release/$PACKAGE" build/assets
          cp build/native/elci README.md "build/release/$PACKAGE/"
          cp -R docs "build/release/$PACKAGE/"
          if [ -f LICENSE ]; then cp LICENSE "build/release/$PACKAGE/"; fi
          tar -czf "build/assets/$PACKAGE.tar.gz" -C build/release "$PACKAGE"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "build/release/$env:PACKAGE"
          New-Item -ItemType Directory -Path $staging, build/assets -Force | Out-Null
          Copy-Item build/native/elci.exe, README.md -Destination $staging
          Copy-Item docs -Destination $staging -Recurse
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $staging }
          Compress-Archive -Path $staging -DestinationPath "build/assets/$env:PACKAGE.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-native-${{ matrix.platform }}
          path: build/assets/${{ env.PACKAGE }}.*
          if-no-files-found: error
          retention-days: 7
