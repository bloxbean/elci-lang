# From the release-ops standard (templates/workflows/bloxbean-snapshot-dist.yml, 2026-10-04), adapted for Elci:
# dist-build.yml builds the distributions, and there is no Development snapshot release job yet.
name: Publish snapshot distributions

# Builds the distribution files of a snapshot commit with dist-build.yml - the JVM zip and the native CLI for Linux
# x64 and ARM64, macOS ARM64 and Windows x64 - and, once a release owner approves, publishes exactly those files to
# the BloxBean repository bucket, read anonymously at https://repo.bloxbean.org/dist/snapshots/elci/. Independent of
# release.yml and of the Maven snapshot repository (bloxbean-snapshot.yml). See bloxbean/release-ops
# docs/12-bloxbean-maven-repository.md, Snapshot distributions.
#
# Each commit gets <version>/ with its files, SHA256SUMS and manifest.json; latest.json names the most recently
# published one. A version directory is never overwritten: manifest.json, uploaded last, marks it as published.
# Every project writes only dist/snapshots/<project>/; one bucket lifecycle rule on dist/snapshots/ expires them.

on:
  workflow_dispatch:

permissions: {}

jobs:
  # Fails before the native builds: only a commit whose push CI passed is published. Its version is
  # <gradle.properties version>-<short commit id>-SNAPSHOT, the Maven snapshot's (dist-build.yml).
  check:
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOWS: build.yml
        run: bash .github/scripts/require-green-ci.sh

  # The JVM zip and the native CLI of four platforms, each smoke-tested, uploaded as dist-* workflow artifacts.
  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/dist-build.yml

  # The approval gate, after the build so the reviewer approves files that were built and smoke-tested. The
  # `release` environment holds no secrets; its reviewers are the release owners, and the person who started the run
  # can't approve it. Waiting for approval costs no runner time.
  approve:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Approved
        run: echo "Publishing the snapshot distributions of $GITHUB_SHA approved."

  publish:
    needs: approve
    # The bucket credentials are secrets of this environment, which only accepts main and release/**.
    environment: release-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Only latest.json is shared between runs; serialize the uploads so it names the most recently published build.
    concurrency:
      group: bloxbean-snapshot-dist
      cancel-in-progress: false
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      PREFIX: dist/snapshots/elci
      PUBLIC_URL: https://repo.bloxbean.org
      DIST_DIR: dist
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # AWS CLI 2.23+ sends request checksums R2 does not accept by default; send them only when an API needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # R2 allows one write per second per key and answers a retry that comes sooner with "Reduce your concurrent
      # request rate for the same object"; the default 3 attempts can all land inside that window.
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'dist-*'
          path: dist
          merge-multiple: true

      # Exactly this commit's files: the JVM zip, three native tarballs and the Windows zip. Every name carries the
      # version, which has the short commit id.
      - name: Verify the distributions
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cli=(elci-[0-9]*-linux-x64.tar.gz)
          VERSION=${cli[0]#elci-}
          VERSION=${VERSION%-linux-x64.tar.gz}
          if [[ ${#cli[@]} != 1 || "$VERSION" != *"-${GITHUB_SHA:0:7}-SNAPSHOT" ]]; then
            echo "::error::Expected one Linux x64 CLI of commit ${GITHUB_SHA:0:7}; found: ${cli[*]}" >&2
            exit 1
          fi
          expected="elci-$VERSION.zip"
          for platform in linux-x64 linux-arm64 macos-arm64; do
            expected+=$'\n'"elci-$VERSION-$platform.tar.gz"
          done
          expected+=$'\n'"elci-$VERSION-windows-x64.zip"
          found=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "$found" != "$(sort <<< "$expected")" ]]; then
            echo "::error::Unexpected distribution set: $(tr '\n' ' ' <<< "$found")" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the manifest
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh manifest

      # Files and SHA256SUMS first, then manifest.json, which marks the build as published, then latest.json. A
      # published build is never overwritten, so its URLs and checksums stay valid until it expires; a run that
      # stopped before the manifest is completed by running again.
      - name: Upload to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh upload

      - name: Verify the public files
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh verify

      - name: Record the publication
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: bash .github/scripts/bloxbean-dist.sh summary
