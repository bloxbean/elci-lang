# From the release-ops standard (templates/workflows/bloxbean-snapshot.yml, 2026-10-04), kept light for now:
# - Elci has no push CI to gate on, so this workflow runs the tests itself instead of require-green-ci.sh.
# - Elci has no Maven Central deployment, so there is no discover step. The one artifact is named below, and
#   verify-maven-staging.py fails if the build stages any other.
# - There is no "Development snapshot" GitHub release job, and no cleanup or distribution workflow yet.
name: Publish snapshot to the BloxBean Maven repository

# Publishes the commit's Maven publication, org.elci:elci-lang, to the BloxBean Maven repository on Cloudflare R2,
# which consumers read anonymously at https://repo.bloxbean.org/maven/snapshots. See bloxbean/release-ops
# docs/12-bloxbean-maven-repository.md.
#
# Gradle only publishes to a local directory, through the `stagingRepository` hook in build.gradle; it knows nothing
# about the storage. .github/scripts/bloxbean-maven.sh (a copy of the release-ops script, unchanged) owns the
# transfer: it seeds the artifact's maven-metadata.xml from the bucket so that Gradle appends the new version
# instead of replacing the version list, uploads the checked tree with the AWS CLI, and verifies the result through
# the public URL with a real Gradle consumer. It never deletes and never writes outside
# maven/snapshots/org/elci/elci-lang/; other BloxBean projects share the bucket.

on:
  workflow_dispatch:

permissions:
  contents: read

# Seed, publish and upload are a read-modify-write of the artifact's maven-metadata.xml: two concurrent runs would
# each drop the other's version from the list. Never cancel a run that may be uploading.
concurrency:
  group: bloxbean-maven-snapshots
  cancel-in-progress: false

jobs:
  publish:
    # The bucket credentials are secrets of this environment, which only accepts main and release/**. Skip other
    # branches rather than fail on the environment's branch policy.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    environment: release-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GROUP_PATH: org/elci
      # The build's only publication. verify-maven-staging.py fails if the staged repository holds any other.
      ARTIFACTS: elci-lang
      BUCKET: ${{ vars.R2_BUCKET }}
      REPOSITORY_PREFIX: maven/snapshots
      PUBLIC_REPOSITORY_URL: https://repo.bloxbean.org/maven/snapshots
      # What the Gradle consumer check resolves, and which of this build's jars it must get.
      CONSUMER_DEPENDENCIES: org.elci:elci-lang
      CONSUMER_REQUIRED: elci-lang
      # Absolute, because Gradle resolves stagingRepository against the project directory.
      STAGING_DIR: ${{ github.workspace }}/build/bloxbean-maven
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # AWS CLI 2.23+ sends request checksums R2 does not accept by default; send them only when an API needs one.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # One version per commit, e.g. 0.1.0-dev-1a2b3c4-SNAPSHOT, passed to every Gradle run below. gradle.properties
      # keeps its plain version, so ordinary builds (and the ABI manifests they write) don't change per commit.
      - name: Resolve the snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^version=//p' gradle.properties)
          VERSION="${BASE%-SNAPSHOT}-$(git rev-parse --short=7 HEAD)-SNAPSHOT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)*-[0-9a-f]{7}-SNAPSHOT$ ]]; then
            echo "::error::Unexpected snapshot version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # Elci has no push CI yet, so the tests run here, against the version being published.
      - name: Test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon test -Pversion="$VERSION"

      - name: Seed metadata from the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh seed

      - name: Stage the Maven publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          ./gradlew --no-daemon publishAllPublicationsToStagingRepository
          -PstagingRepository="$STAGING_DIR" -Pversion="$VERSION" --stacktrace

      - name: Verify the staged repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one argument per artifactId
          python3 .github/scripts/verify-maven-staging.py "$STAGING_DIR" "$RUNNER_TEMP/maven-seed" "$GROUP_PATH" \
            "$VERSION" $ARTIFACTS

      - name: Upload to the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh upload

      - name: Verify the public repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh verify-public

      - name: Resolve with a Gradle consumer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/bloxbean-maven.sh consume

      - name: Record the publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Published \`$VERSION\` to the BloxBean Maven repository"
            echo
            echo "\`org.elci:elci-lang\` under $PUBLIC_REPOSITORY_URL/$GROUP_PATH/"
            echo
            echo '```groovy'
            echo 'repositories {'
            echo '    mavenCentral()'
            echo '    maven {'
            echo "        url = uri('$PUBLIC_REPOSITORY_URL')"
            echo '        mavenContent { snapshotsOnly() }'
            echo '    }'
            echo '}'
            echo 'dependencies {'
            echo "    testImplementation 'org.elci:elci-lang:$VERSION'"
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
