name: Build

# The checks from docs/VALIDATION.md that need no devnet and no GraalVM, on every pull request and every push to
# main or release/**: the Gradle build (tests and jars), the elm-format corpus, and the JVM `elci` CLI on the
# examples. The native CLI is built by release.yml, and the devnet suite (:e2e-test:e2eTest) runs by hand.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Tests, the jar, sources and javadoc jars (as the snapshot workflow publishes them), and the e2e-test
      # sources, which compile but don't run without a devnet.
      - name: Build
        run: ./gradlew --no-daemon build installDist --stacktrace

      # The rest of src/test/resources/syntax/valid is left out on purpose: the grammar corpus exercises layouts
      # elm-format would rewrite (layout.elm) and Elci syntax it can't parse (negation.elm).
      - name: Check formatting
        run: >-
          npm exec --yes --package elm-format@0.8.8 --
          elm-format examples src/main/resources/elci/core src/main/resources/elci/test
          src/test/resources/syntax/valid/core-completion.elm src/test/resources/syntax/unsupported --validate

      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/build/install/elci/bin:$PATH"
          elci --version
          elci check examples/threshold
          elci build examples/threshold
          test -s examples/threshold/build/validators/threshold/validator.plutus.json
          elci eval examples/functional
          elci eval examples/core-completion
          elci test examples/treasury --seed 42
          elci test examples/vesting --fuzz 300

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
