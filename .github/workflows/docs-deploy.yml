# From the release-ops standard (templates/workflows/docs-deploy.yml, 2026-09-14), adapted for Elci: the site in
# www/ also reads the repository (stdlib modules, the stdlib inventory, diagnostics, examples and gradle.properties;
# see www/scripts/ai-artifacts.mjs), so those paths trigger it too. The domain comes from the repository variable
# DOCS_DOMAIN: the site uses root-relative links, so it must be served at the root of a domain, not under
# bloxbean.github.io/elci-lang/.
name: Documentation

# Pull requests that touch the docs only build. A push to main that touches them, or a manual run on main, also
# pushes the site to the gh-pages branch. The live site does not change until GitHub's Pages deployment for that
# push is approved in the `github-pages` environment, so every publish -- whichever way it was triggered -- goes
# through that approval. Not triggered by tags: anyone with write access can create a non-v* tag.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'src/main/resources/elci/**'
      - 'docs/stdlib-compatibility.tsv'
      - 'docs/DIAGNOSTICS.md'
      - 'examples/**'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'src/main/resources/elci/**'
      - 'docs/stdlib-compatibility.tsv'
      - 'docs/DIAGNOSTICS.md'
      - 'examples/**'
      - 'gradle.properties'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      # `npm run build` also runs scripts/check-site.mjs, which checks every local link, asset and anchor.
      # Pull requests build without DOCS_DOMAIN, with the placeholder origin a local build uses.
      - name: Build docs
        working-directory: www
        env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
        run: |
          if [[ -n "$DOCS_DOMAIN" ]]; then export ELCI_SITE_URL="https://$DOCS_DOMAIN"; fi
          npm ci
          npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: www/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only the default branch publishes; a pull request, or a manual run on another branch, only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require the docs domain
        env:
          DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN }}
        run: |
          if [[ -z "$DOCS_DOMAIN" ]]; then
            echo "::error::Set the repository variable DOCS_DOMAIN (e.g. docs.example.org) before publishing." >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the built site.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: ${{ vars.DOCS_DOMAIN }}

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "The site updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
